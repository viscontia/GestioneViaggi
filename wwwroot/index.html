<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GestioneViaggi</title>
    <base href="/" />

    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- 1. FONTS PRIMA DI TUTTO -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- 2. CSS MUDBLAZOR -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <!-- Quill.js Rich Text Editor (per Blazored.TextEditor) - locale per MAUI WebView -->
    <link href="lib/quill/quill.snow.css" rel="stylesheet">

    <!-- 3. IL TUO CSS PER ULTIMO (sovrascrive tutto) - ULTRA SPECIFIC -->
    <link rel="stylesheet" href="css/premium-saas-ULTRA-SPECIFIC.css?v=5.0" />

    <style>
        /* Animazioni per lo Splash Screen Blazor interno a #app */
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0% { opacity: 0.8; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(0.98); }
        }
    </style>
</head>

<body>
    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; background-color:#172331;">
            <p style="color: white; font-family: 'Inter', sans-serif;">Caricamento in corso...</p>
        </div>
    </div>

    <div id="blazor-error-ui" style="z-index: 10000;">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- PRIMA di blazor.webview.js: deve poter registrare anche cio' che va storto durante l'avvio -->
    <script src="js/registroErrori.js"></script>

    <script src="_framework/blazor.webview.js"></script>

    <!-- MUDBLAZOR JS (FONDAMENTALE) -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

    <!-- Quill.js Rich Text Editor - locale per MAUI WebView -->
    <script src="lib/quill/quill.min.js"></script>
    <script src="_content/Blazored.TextEditor/quill-blot-formatter.min.js"></script>
    <script src="_content/Blazored.TextEditor/Blazored-BlazorQuill.js"></script>

    <!-- Custom JavaScript -->
    <script src="js/themeHelper.js"></script>
    <script src="js/login.js"></script>
    <script src="js/dialogFormHelper.js"></script>
    <script src="js/focusHelper.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/newsletterPreview.js"></script>
</body>

</html>
