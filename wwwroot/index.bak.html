<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GestioneViaggi</title>
    <base href="/" />

    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- 1. FONTS PRIMA DI TUTTO -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- 2. CSS MUDBLAZOR -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <!-- 3. IL TUO CSS PER ULTIMO (sovrascrive tutto) - ULTRA SPECIFIC -->
    <link rel="stylesheet" href="css/premium-saas-ULTRA-SPECIFIC.css?v=5.0" />
</head>

<body>
    <div class="status-bar-safe-area"></div>

    <div id="app">
        <style>
            /* Stile dello Splash Screen Blazor per transizione invisibile da MAUI */
            #app-splash {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: #172331;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 9999;
            }
            .splash-logo {
                max-width: 60%;
                max-height: 30%;
                object-fit: contain;
                animation: pulse 2s infinite ease-in-out;
            }
            .splash-loader {
                margin-top: 50px;
                width: 48px;
                height: 48px;
                border: 4px solid rgba(255, 255, 255, 0.2);
                border-top-color: #512BD4; /* Colore per richiamare stile MAUI originale */
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }
            .splash-text {
                margin-top: 24px;
                color: rgba(255, 255, 255, 0.7);
                font-family: 'Inter', sans-serif;
                font-size: 15px;
                font-weight: 500;
                letter-spacing: 2px;
            }
            @keyframes spin {
                100% { transform: rotate(360deg); }
            }
            @keyframes pulse {
                0% { opacity: 0.8; transform: scale(0.98); }
                50% { opacity: 1; transform: scale(1); }
                100% { opacity: 0.8; transform: scale(0.98); }
            }
        </style>
        <div id="app-splash">
            <img src="splashscreen.png" alt="Gestione Viaggi" class="splash-logo" />
            <div class="splash-loader"></div>
            <div class="splash-text">AVVIO GESTIONALE...</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js"></script>

    <!-- MUDBLAZOR JS (FONDAMENTALE) -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="js/themeHelper.js"></script>
    <script src="js/login.js"></script>
    <script src="js/dialogFormHelper.js"></script>
    <script src="js/focusHelper.js"></script>
    <script src="js/utils.js"></script>
</body>

</html>
